<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>简历工作台 · resume-studio</title>
    <!--
      字体用 <link> 引入而不是在 JS 里 import：public/ 下的 CSS 是原样拷贝的静态
      资源，Vite 不允许作为模块导入。这里也顺便让字体请求尽早发出。
    -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <!--
      预热两档最常用的：拉丁正体 + 常用汉字正体。
      名字必须与 scripts/build-fonts.py 产出的文件一致（serif-*），否则 404。
    -->
    <link
      rel="preload"
      href="/fonts/generated/serif-400-base.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/generated/serif-400-cjk1.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
